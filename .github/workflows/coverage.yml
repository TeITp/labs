name: Coverage
on:
  push:
    paths:
      - '07_testing_coverage/**'
      - '.github/workflows/coverage.yml'
  pull_request:
    paths:
      - '07_testing_coverage/**'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_testing_coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.1.1 pytest-cov==7.1.0 coverage==7.17.0
      - run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            07_testing_coverage/coverage.xml
            07_testing_coverage/htmlcov/
