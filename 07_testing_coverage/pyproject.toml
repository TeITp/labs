[project]
name = "testing-coverage"
version = "0.1.0"
description = "Робота 07.3: покриття коду (coverage, pytest-cov)"
authors = [{ name = "Кушнір Андрій" }]
requires-python = ">=3.11"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
coverage = "^7.17.0"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# показувати кириличні id параметрів без \uXXXX-екранування (і щоб працював -k "трикутник")
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# Демонстраційні тести запускаються окремо для порівняння.
norecursedirs = ["examples", ".venv", "htmlcov"]
